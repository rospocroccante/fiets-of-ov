# Alembic config. The database URL is NOT set here — env.py pulls it from app settings
# (pydantic-settings / .env), so there's a single source of truth and no secrets in git.
[alembic]
script_location = alembic
prepend_sys_path = .
# Split path options with os.pathsep (silences Alembic's legacy-splitting deprecation,
# which the test suite's warnings=error would otherwise turn into a failure).
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

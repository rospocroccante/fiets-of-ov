# Phase 0 stack: the app plus the two infra services it will need in later phases
# (Postgres for stops/users, Redis for cache + the ARQ queue). They aren't wired
# into the app yet — they're here so `docker compose up` brings up the full shell.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Live-reload during development; the source is bind-mounted over the image copy.
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fiets
      POSTGRES_PASSWORD: fiets
      POSTGRES_DB: fiets
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiets"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

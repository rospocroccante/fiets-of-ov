[project]
name = "fiets-of-ov"
version = "0.0.0"
description = "Bike-or-public-transport advice for Amsterdam, given the short-term rain forecast."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    # Pinned exactly: formatting output changes between ruff releases, so CI's
    # `ruff format --check` must run the same version as the local venv.
    "ruff==0.15.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be called in argument
# defaults; they are effectively immutable, so B008 should not flag them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the project root on sys.path so `import app` works under the `pytest` console script
# (not just `python -m pytest`), independent of the editable install's state.
pythonpath = ["."]
filterwarnings = [
    "error",
    # Starlette's TestClient warns about httpx on newer interpreters (e.g. local 3.14);
    # the project targets 3.12 where it doesn't fire. Narrow ignore, not a blanket one.
    "ignore:Using `httpx` with `starlette.testclient`",
]

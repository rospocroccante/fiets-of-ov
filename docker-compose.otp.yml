# Optional self-hosted OTP overlay (Phase 8 trial).
#
# Brings up a local OpenTripPlanner for Amsterdam so the app no longer depends on a
# third-party routing service. Kept in a SEPARATE compose file so the core stack
# (docker-compose.yml) stays lean; run with:
#
#   docker compose -f docker-compose.yml -f docker-compose.otp.yml up
#
# Prereqs: place the inputs in ./otp/data first (see otp/README or otp/scripts):
#   amsterdam.osm.pbf, gtfs-gvb.zip  (the jar is not needed — the image bundles OTP).
# The first run builds ./otp/data/graph.obj; later runs reuse it.
services:
  otp:
    image: docker.io/opentripplanner/opentripplanner:2.6.0
    # Build the graph if missing, then serve it. --port 8080 inside the container.
    command: >
      --build --save --load /var/otp
    volumes:
      - ./otp/data:/var/otp
      - ./otp/build-config.json:/var/otp/build-config.json:ro
      - ./otp/router-config.json:/var/otp/router-config.json:ro
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx8g"

  app:
    # Point the app at the local OTP instead of any external routing service.
    environment:
      OTP_BASE_URL: "http://otp:8080"
    depends_on:
      - otp
